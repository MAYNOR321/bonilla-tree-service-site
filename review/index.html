<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a review · Bonilla Tree Service LLC</title>

<!-- Esta pagina es una puerta, no contenido: existe para redirigir al
     formulario de resena de Google. No debe aparecer en buscadores. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="/assets/images/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --pine: #0E3A1C;
    --leaf: #3F9E52;
    --sprout: #8FD49B;
    --sage: #EEF4E9;
    --hivis: #D6FF3D;
    --bark: #241C14;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--pine);
    color: var(--sage);
    font-family: "Inter Tight", system-ui, sans-serif;
    line-height: 1.55;
    text-align: center;
  }

  .card { max-width: 22rem; }

  /* El logo es verde oscuro con corona dorada: sobre el fondo pino la letra
     desaparece. Un disco claro detras lo rescata sin retocar el archivo. */
  .mark-chip {
    width: 5.5rem;
    height: 5.5rem;
    margin: 0 auto 1.35rem;
    display: grid;
    place-items: center;
    background: var(--sage);
    border-radius: 50%;
  }

  img.mark { width: 3.1rem; height: auto; display: block; }

  h1 {
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
    font-weight: 900;
    font-size: clamp(2rem, 9vw, 2.8rem);
    line-height: 0.95;
    text-transform: uppercase;
    color: #FFFFFF;
    margin: 0 0 0.75rem;
  }

  p { margin: 0 0 1.75rem; color: var(--sprout); font-size: 1.02rem; }

  .btn {
    display: block;
    padding: 1rem 1.5rem;
    background: var(--hivis);
    color: var(--bark);
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
    font-weight: 900;
    font-size: 1.35rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--hivis);
    transition: background 0.3s, color 0.3s;
  }

  .btn:hover, .btn:focus-visible { background: #FFFFFF; border-color: #FFFFFF; }

  .alt {
    display: block;
    margin-top: 1rem;
    padding: 0.85rem 1.5rem;
    border: 1px solid rgba(143, 212, 155, 0.55);
    color: var(--sage);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .alt:hover { background: rgba(143, 212, 155, 0.12); }

  .spinner {
    width: 1.6rem;
    height: 1.6rem;
    margin: 0 auto 1.25rem;
    border: 3px solid rgba(143, 212, 155, 0.35);
    border-top-color: var(--hivis);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <div class="mark-chip">
    <img class="mark" src="/assets/images/logo-mark.png" width="351" height="499" alt="Bonilla Tree Service LLC">
  </div>

  <!-- Estado normal: el enlace de Google esta configurado y redirigimos. -->
  <div id="going" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <h1 data-en="Thank you!" data-es="¡Gracias!">Thank you!</h1>
    <p data-en="Taking you to Google to leave your review…" data-es="Llevándolo a Google para dejar su reseña…">Taking you to Google to leave your review…</p>
    <a class="btn" id="go-link" href="#" data-en="Leave your review" data-es="Dejar su reseña">Leave your review</a>
  </div>

  <!-- Respaldo: mientras el perfil no este verificado no existe enlace de
       resena, asi que la pagina ofrece la siguiente mejor accion. -->
  <div id="fallback" hidden>
    <h1 data-en="Thank you!" data-es="¡Gracias!">Thank you!</h1>
    <p data-en="Our review page is being set up. In the meantime, call or text us — we read every message." data-es="Nuestra página de reseñas se está configurando. Mientras tanto, llámenos o mándenos un texto — leemos todos los mensajes.">Our review page is being set up. In the meantime, call or text us — we read every message.</p>
    <a class="btn" href="tel:+16014669145">601-466-9145</a>
    <a class="alt" href="/" data-en="Visit our website" data-es="Ver nuestro sitio">Visit our website</a>
  </div>
</div>

<script>
(function () {
  // ==========================================================================
  // EL UNICO VALOR QUE HAY QUE CAMBIAR
  // ==========================================================================
  // Pegar aqui el enlace de resena de Google apenas el perfil este verificado.
  // Se saca del panel del perfil: "Ask for reviews" / "Pedir resenas", que da
  // un enlace corto tipo https://g.page/r/XXXXXXXX/review
  //
  // Tambien sirve el formato largo, si se tiene el Place ID:
  //   https://search.google.com/local/writereview?placeid=PLACE_ID
  //
  // Mientras este vacio, la pagina muestra el respaldo con el telefono en vez
  // de mandar a la gente a un enlace roto.
  const REVIEW_URL = "";

  // Cuantos milisegundos mostrar el "gracias" antes de saltar a Google. Un
  // instante de marca, sin que se sienta lento.
  const REDIRECT_DELAY_MS = 900;
  // ==========================================================================

  const going = document.getElementById("going");
  const fallback = document.getElementById("fallback");

  // Espanol si el navegador del cliente esta en espanol, o si el enlace que se
  // le mando trae ?lang=es. La cuadrilla puede mandar la version que aplique.
  const param = new URLSearchParams(location.search).get("lang");
  const lang = param === "es" || param === "en"
    ? param
    : (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";

  document.documentElement.lang = lang;
  document.querySelectorAll("[data-en]").forEach((el) => {
    const value = el.getAttribute(lang === "es" ? "data-es" : "data-en");
    if (value != null) el.textContent = value;
  });

  if (!REVIEW_URL) {
    fallback.hidden = false;
    return;
  }

  going.hidden = false;
  document.getElementById("go-link").href = REVIEW_URL;

  // El boton queda visible siempre: si el navegador bloquea la redireccion
  // automatica, el cliente igual tiene donde tocar.
  setTimeout(function () {
    location.replace(REVIEW_URL);
  }, REDIRECT_DELAY_MS);
})();
</script>
</body>
</html>
